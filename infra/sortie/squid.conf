# Proxy sortant d'Organizer : seule route vers Internet de l'API et du worker (cahier, section Réseaux).
# Chaque conteneur n'atteint que sa liste fermée de domaines, en HTTPS (CONNECT 443) seulement.
# Adresses fixes sur le réseau « sortie » : voir infra/docker-compose.yml.
http_port 3128
pid_filename /tmp/squid.pid
coredump_dir /tmp
cache deny all
cache_mem 0 MB
pinger_enable off
netdb_filename none
# Journal sans chemin d'URL (un jeton de bot peut en faire partie) : date, client, méthode, domaine:port, statut, résultat.
logformat sobre %ts.%03tu %>a %rm %>rd:%>rP %>Hs %Ss
access_log stdio:/dev/stdout sobre
cache_log /dev/stderr
logfile_rotate 0
shutdown_lifetime 1 seconds
via off
forwarded_for delete
visible_hostname sortie

acl CONNECT method CONNECT
acl port_https port 443
acl depuis_api src 10.201.2.10/32
acl depuis_worker src 10.201.2.11/32
# Ensemble POSIX (regcomp de musl) : « ] » en tête est littéral, l'antislash n'y échappe rien.
# -n : pas de résolution inverse, le nom demandé seul compte ; les adresses brutes sont refusées avant toute autorisation.
acl ip_brute dstdom_regex -n ^[]0-9.:[]+$
acl vers_api dstdomain -n api.telegram.org
acl vers_worker dstdomain -n generativelanguage.googleapis.com

http_access deny !CONNECT
http_access deny !port_https
http_access deny ip_brute
http_access allow depuis_api vers_api
http_access allow depuis_worker vers_worker
http_access deny all
