# Stack Organizer — déployée par Dockge, publiée par le Nginx Proxy Manager existant.
# Référence : docs/cahier-des-charges.md (Déploiement Docker) et docs/exploitation.md.
#
# Dans Dockge : ce fichier est le compose.yaml de la stack « organizer » (/opt/stacks/organizer/),
# avec son .env (modèle : infra/.env.example) et le dossier secrets/ (un fichier par secret).
#
# Réseaux : web seul est publié ; api, worker et scheduler n'ont aucune route vers Internet et sortent
# par le proxy « sortie », qui n'ouvre que leur liste fermée de domaines (infra/sortie/squid.conf).
# 50 Go maximum pour la stack (décision 12). Pas de sauvegarde avant le lot 2 (décision 11).
# Le scheduler écrit dans Google Agenda (lot 2-A) ; la rotation de l'audio le rejoindra.

name: organizer

x-journal: &journal
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-app: &app
  restart: unless-stopped
  user: "1000:1000"
  read_only: true
  tmpfs:
    - /tmp
  logging: *journal
  # Pas d'env_file : les clés passent uniquement par les secrets.
  environment: &app-env
    NODE_ENV: production
    TZ: Europe/Paris
    HOME: /tmp
    DATABASE_URL: postgresql://organizer:${POSTGRES_PASSWORD:?}@db:5432/organizer
    REDIS_URL: redis://queue:6379
    PROMPTS_DIR: /app/prompts
    PROMPT_VERSION: ${PROMPT_VERSION:-tri/v1}
    AUDIO_STORAGE_PATH: /data/audio
    HTTPS_PROXY: http://sortie:3128
    NO_PROXY: db,queue,localhost,127.0.0.1

services:
  # Migrations Prisma jouées avant le démarrage de l'API et du worker.
  migrate:
    <<: *app
    image: ghcr.io/djkix/organizer-api:${ORGANIZER_VERSION:?}
    restart: "no"
    command: ["node", "packages/db/node_modules/prisma/build/index.js", "migrate", "deploy", "--schema", "packages/db/prisma/schema.prisma"]
    networks: [core]
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m

  api:
    <<: *app
    image: ghcr.io/djkix/organizer-api:${ORGANIZER_VERSION:?}
    environment:
      <<: *app-env
      TELEGRAM_MODE: webhook
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TELEGRAM_WEBHOOK_SECRET_FILE: /run/secrets/telegram_webhook_secret
      TELEGRAM_WEBHOOK_URL: https://${DOMAINE_BOT:?}/telegram/webhook
      # X-Forwarded-For cru de Caddy (réseau edge) et du Nginx Proxy Manager, seulement.
      TRUSTED_PROXY: 10.201.1.0/24, ${NPM_IP:?NPM_IP vide, renseigner l'adresse du Nginx Proxy Manager dans .env}
      # Empreinte (WebAuthn, décision 23) : identifiant de RP et origine exacte de la PWA.
      WEBAUTHN_RP_ID: ${DOMAINE_APP:?}
      WEBAUTHN_ORIGIN: https://${DOMAINE_APP:?}
      # Google Agenda : l'API prépare l'adresse de consentement sans jamais joindre Google (identifiant public, pas un secret).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?}
      GOOGLE_REDIRECT_URI: https://${DOMAINE_APP:?}/api/agenda/retour
    secrets: [telegram_bot_token, telegram_webhook_secret]
    volumes:
      - audio:/data/audio
    networks:
      edge: {}
      core: {}
      sortie:
        ipv4_address: 10.201.2.10
    depends_on:
      migrate:
        condition: service_completed_successfully
      queue:
        condition: service_healthy
      sortie:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/sante"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m

  worker:
    <<: *app
    image: ghcr.io/djkix/organizer-worker:${ORGANIZER_VERSION:?}
    environment:
      <<: *app-env
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_MODEL_FALLBACK: ${GEMINI_MODEL_FALLBACK:-gemini-3.8-flash}
      GEMINI_TIERS_PAYES: ${GEMINI_TIERS_PAYES:-standard}
      # Vide : rien n'est demandé (valeur relevée à l'étape A2 de la mise en service).
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-}
      # Vide : défaut du worker (402,403,429). Ne jamais y mettre 400.
      GEMINI_STATUTS_INDISPONIBLES: ${GEMINI_STATUTS_INDISPONIBLES:-}
      # Plafond de concurrence : ne pas saturer le quota Gemini en rattrapage.
      WORKER_CONCURRENCY: "2"
    secrets: [gemini_api_key]
    volumes:
      - audio:/data/audio:ro
    networks:
      core: {}
      sortie:
        ipv4_address: 10.201.2.11
    depends_on:
      migrate:
        condition: service_completed_successfully
      queue:
        condition: service_healthy
      sortie:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 768m

  # Google Agenda (lot 2-A) : seul conteneur qui parle à Google, par « sortie », vers www.googleapis.com
  # et oauth2.googleapis.com seulement. Jeton de rafraîchissement chiffré par agenda_cle.
  scheduler:
    <<: *app
    image: ghcr.io/djkix/organizer-scheduler:${ORGANIZER_VERSION:?}
    environment:
      <<: *app-env
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?}
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      GOOGLE_REDIRECT_URI: https://${DOMAINE_APP:?}/api/agenda/retour
      AGENDA_CLE_FILE: /run/secrets/agenda_cle
    secrets: [google_client_secret, agenda_cle]
    networks:
      core: {}
      sortie:
        ipv4_address: 10.201.2.12
    depends_on:
      migrate:
        condition: service_completed_successfully
      queue:
        condition: service_healthy
      sortie:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256m

  # Coquille de la PWA, en-têtes, et passage vers l'API (infra/caddy/Caddyfile).
  web:
    image: ghcr.io/djkix/organizer-web:${ORGANIZER_VERSION:?}
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      NPM_IP: ${NPM_IP:?NPM_IP vide, renseigner l'adresse du Nginx Proxy Manager dans .env}
      DOMAINE_BOT: ${DOMAINE_BOT:?}
    # Seul port publié de la stack, sur l'adresse de la VM, pour le Nginx Proxy Manager.
    ports:
      - "${IP_PUBLICATION:?}:7070:8080"
    networks: [publication, edge]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *journal
    deploy:
      resources:
        limits:
          memory: 64m

  # Proxy sortant : seule route vers Internet (infra/sortie/squid.conf).
  sortie:
    image: ghcr.io/djkix/organizer-sortie:${ORGANIZER_VERSION:?}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    networks:
      sortie:
        ipv4_address: 10.201.2.2
      egress: {}
    logging: *journal
    deploy:
      resources:
        limits:
          memory: 64m

  db:
    image: pgvector/pgvector:0.8.0-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: organizer
      POSTGRES_DB: organizer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      TZ: Europe/Paris
    # Réglé pour une limite de 1 Go : deux utilisateurs, une cinquantaine de captures par jour.
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "effective_cache_size=512MB", "-c", "work_mem=8MB", "-c", "max_connections=30"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [core]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U organizer -d organizer"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *journal
    deploy:
      resources:
        limits:
          memory: 1g

  queue:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - valkeydata:/data
    networks: [core]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *journal
    deploy:
      resources:
        limits:
          memory: 128m

networks:
  # Publication du seul port de web vers le Nginx Proxy Manager.
  publication: {}
  # web ↔ api. Interne : l'API n'y trouve aucune route vers Internet.
  edge:
    internal: true
    ipam:
      config:
        - subnet: 10.201.1.0/24
  # api, worker, scheduler, migrations, base, file. Aucune sortie Internet.
  core:
    internal: true
  # api, worker et scheduler vers le proxy sortant ; adresses fixes reprises dans squid.conf.
  sortie:
    internal: true
    ipam:
      config:
        - subnet: 10.201.2.0/24
  # Le proxy sortant seul atteint Internet.
  egress: {}

volumes:
  pgdata:
  audio:
  valkeydata:

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  telegram_webhook_secret:
    file: ./secrets/telegram_webhook_secret
  gemini_api_key:
    file: ./secrets/gemini_api_key
  google_client_secret:
    file: ./secrets/google_client_secret
  agenda_cle:
    file: ./secrets/agenda_cle
